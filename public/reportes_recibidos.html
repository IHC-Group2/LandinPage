<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reportes Recibidos</title>
    <link rel="stylesheet" href="assets/Styles/validation.css">
    <link rel="stylesheet" href="assets/Styles/style.css">
    <link rel="stylesheet" href="assets/Styles/reportes_recibidos.css">
    <link rel="stylesheet" href="assets/Styles/validation.css"> </head>
<body>
    <nav class="top-header">
        <ul class="menu-horizontal">
            <li><a href="LoggedIndex.html" class="btn-inicio"><img src="Imagenes/logo.png" alt="Inicio"></a></li>
            <li><a href="LoggedIndex.html">INICIO</a></li>
            <li><a href="Monitoreo.html">MONITOREO</a></li>
            <li><a href="LoggedIndex.html#Seguridad">PREVENCIÓN</a></li>
            <li><a href="reportes.html">MAPAS</a></li>
            <li><a href="Contactanos.html">CONTACTO</a></li>
            <li><a href="LoggedIndex.html" class="btn-cuenta"><img src="Imagenes/usuario.png" alt="Cuenta"></a></li>
        </ul>
    </nav>
    <main class="reportes-main">
        <div class="columna-control">
            <div class="mapa-interactivo-header">
                <h2>MAPA INTERACTIVO</h2>
            </div>
            <div class="busqueda-container">
                <input type="text" placeholder="Buscar lugar..." value="Lima Marina Club">
            </div>
            <div class="filtro-alertas">
                <span>Alertas registradas:</span>
                <div class="filtro-accion">
                    <span>Filtrar</span>
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                        <path d="M1.5 1.5A.5.5 0 0 1 2 1h12a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-.128.334L10 8.692V13.5a.5.5 0 0 1-.74.439L7 12.361V8.692L1.628 3.834A.5.5 0 0 1 1.5 3.5zM2 2v1.586l4.5 4.5v4.036l2 1.143V8.086l4.5-4.5V2z"/>
                    </svg>
                    <button class="btn-limpiar" onclick="limpiarFiltros()">Limpiar X</button>
                </div>
            </div>
            <div class="alerta-card">
                <div class="alerta-info">
                    <h3>Oleaje intenso</h3>
                    <p>Intensidad: Alta</p>
                    <p>Hace 2 horas</p>
                </div>
                <div class="alerta-reaccion">
                    <span>👍</span><span>👎</span>
                </div>
            </div>
        </div>
        <div class="columna-mapa">
            <img src="Imagenes/mapa2.jpg" alt="Mapa">
            <div class="marcador-mapa">
                <p>Lima Marina Club</p>
                <p>Alerta: Oleaje Alto</p>
            </div>
        </div>
    </main>
    <script src="assets/Scripts/main.js"></script>
</body>
</html>
