<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - AquaSafe360</title>
    <link rel="stylesheet" href="assets/Styles/style.css">
    <link rel="stylesheet" href="assets/Styles/registration.css">
    <link rel="stylesheet" href="assets/Styles/validation.css"> </head>
<body>
    <nav class="top-header">
        <ul class="menu-horizontal">
            <li><a href="index.html" class="btn-inicio"><img src="Imagenes/logo.png" alt="Inicio"></a></li>
            <li><a href="index.html">INICIO</a></li>
            <li><a href="index.html#Contactanos">CONTACTANOS</a></li>
            <li><a href="index.html#Nosotros">NOSOTROS</a></li>
            <li><a href="login.html" class="btn-cuenta"><img src="Imagenes/usuario.png" alt="Cuenta"></a></li>
        </ul>
    </nav>
    <main>
        <section class="registration-hero">
            <div class="registration">
                <img src="Imagenes/usuario.png" alt="Logo Usuario de Login">
                
                <form class="registration-form" onsubmit="return validateRegistration(event)">
                    <div class="form-group">
                        <span class="label">Nombre:</span>
                        <input type="text" name="nombre" placeholder="Jesus" required>
                    </div>

                    <div class="form-group">
                        <span class="label">Apellido:</span>
                        <input type="text" name="apellido" placeholder="Rodriguez" required>
                    </div>

                    <div class="form-group">
                        <span class="label">Correo:</span>
                        <input type="email" name="correo" placeholder="example@domain.com" required>
                    </div>

                    <div class="form-group">
                        <span class="label">Contraseña:</span>
                        <input type="password" name="contraseña" placeholder="Password" required>
                    </div>

                    <button class="btn-registration" type="submit">
                        Continuar
                    </button>
                    
                    <button type="button" class="btn-registration-facebook">
                        <a href="#">Continuar Con Facebook</a>
                    </button>
                    <button type="button" class="btn-registration-google">
                        <a href="#">Continuar Con Gmail</a>
                    </button>
                    
                    <h3 class="text-login">¿Ya tienes cuenta?</h3>
                    <button type="button" class="btn-login">
                        <a href="login.html">Iniciar Sesión</a>
                    </button>
                </form>
                
            </div>
        </section>
    </main>
    <script src="assets/Scripts/main.js"></script>
</body>
</html>
