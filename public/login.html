<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - AquaSafe360</title>
    <link rel="stylesheet" href="assets/Styles/validation.css">
    <link rel="stylesheet" href="assets/Styles/Login.css">
    <link rel="stylesheet" href="assets/Styles/style.css">
    <link rel="stylesheet" href="assets/Styles/validation.css"> </head>
<body>
    <nav class="top-header">
        <ul class="menu-horizontal">
            <li>
                <a href="index.html" class="btn-inicio">
                    <img src="Imagenes/logo.png" alt="Imagen de inicio">
                </a>
            </li>
            <li> <a href="index.html">INICIO</a></li>
            <li> <a href="index.html#Monitoreo">MONITOREO</a></li>
            <li><a href="index.html#Seguridad">SEGURIDAD</a></li>
            <li><a href="index.html#Mapas">MAPAS</a></li>
            <li>
                <a href="index.html#Contactanos">CONTACTANOS</a>
                <ul class="menu-vertical">
                    <li>WhatsApp</li>
                    <li>Instagram</li>
                </ul>
            </li>
            <li><a href="index.html#Nosotros">NOSOTROS</a></li>
            <li>
                <a href="login.html" class="btn-cuenta"><img src="Imagenes/usuario.png" alt="imagen de cuenta"></a>
            </li>
        </ul>
    </nav>
    <main>
        <section class="login-hero">
            <div class="login">
                <img src="Imagenes/usuario.png" alt="Logo Usuario de Login">
                
                <div id="login-success" class="success-message"></div>

                <form class="login-form" onsubmit="return validateLogin(event)">
                    <div class="form-group">
                        <span class="label">Correo Electrónico:</span>
                        <input type="email" name="email" placeholder="ejemplo@correo.com" required autocomplete="username">
                    </div>

                    <div class="form-group">
                        <span class="label">Contraseña:</span>
                        <input type="password" name="contraseña" placeholder="********" required autocomplete="current-password">
                    </div>
                    
                    <button type="submit" class="btn-login">
                        Iniciar Sesión
                    </button>
                    <div style="margin-top: 1rem; text-align: center;">
                        <a href="registration.html" style="color: white; text-decoration: underline;">¿No tienes cuenta? Regístrate aquí</a>
                    </div>
                </form>
                
            </div>
        </section>
    </main>
    <script src="assets/Scripts/main.js"></script>
</body>
</html>
